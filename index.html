<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아케이 발주">
<link rel="manifest" href="manifest.json">
<title>아케이 발주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E8; --card:#FFFDF9; --ink:#2A2521; --sub:#6F655B; --muted:#9C9285; --line:#E7DED0;
  --green:#2F5D50; --green2:#3E7564; --greenbg:#E6EEE9; --stamp:#C8402F; --stampbg:#FBE9E5;
  --amber:#B7791F; --amberbg:#FBF0DC; --gold:#B98B3E; --sky:#3B6E9C; --skybg:#E5EEF6; --plum:#7A4E86; --plumbg:#F1E8F3;
  --r:18px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(rgba(120,90,50,.035) 1px,transparent 1px);background-size:4px 4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center}
#lock .seal{width:84px;height:84px;border-radius:22px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:40px;font-weight:700;box-shadow:0 10px 30px rgba(47,93,80,.3);transform:rotate(-4deg)}
#lock h1{font-family:var(--serif);font-size:36px;margin:26px 0 4px;letter-spacing:.04em}
#lock p{color:var(--sub);margin:0 0 30px;font-size:15px}
#lock form{width:100%;max-width:320px}
#lock input[type=password]{width:100%;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:18px;text-align:center;letter-spacing:.15em;outline:none}
#lock input[type=password]:focus{border-color:var(--green)}
#lock .remember{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 18px;color:var(--sub);font-size:14px}
#lockErr{color:var(--stamp);font-size:14px;min-height:22px;margin-top:12px}

#app{max-width:560px;margin:0 auto;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(246,241,232,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top .brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:9px}
header.top .brand i{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font-style:normal;display:grid;place-items:center;font-size:16px;transform:rotate(-4deg)}
header.top .when{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(255,253,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--green)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--stamp);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:17px;font-weight:700}
section.page{padding:4px 16px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.dsel{appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%23B98B3E%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E") no-repeat right 12px center;color:var(--gold);font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;padding:7px 34px 7px 13px;border-radius:99px;outline:none}
.title{font-family:var(--serif);font-size:26px;margin:6px 0 2px;font-weight:700}
.muted{color:var(--muted)} .sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0;border:1px solid rgba(231,222,208,.6)}
.card h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .more{font-size:13px;color:var(--green);font-weight:600}
.card.hero{background:linear-gradient(135deg,#2F5D50,#24493F);color:#fff;border:0;position:relative;overflow:hidden}
.card.hero.alert{background:linear-gradient(135deg,#B5432F,#8F2F22)}
.card.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.card.hero .big small{font-size:17px;font-weight:700;margin-left:3px;opacity:.85}
.card.hero .stats{display:flex;gap:7px}
.card.hero .stats div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:9px;font-size:11.5px;min-width:0}
.card.hero .stats b{display:block;font-size:14px;white-space:nowrap}
.card.hero .wm{position:absolute;right:-10px;bottom:-34px;font-family:var(--serif);font-size:130px;font-weight:700;opacity:.07;pointer-events:none}
.card.dashed{border:1.5px dashed var(--gold);background:#FFFBF2}
.note{background:#F3EEE6;border-radius:14px;padding:14px 15px;font-size:14.5px;color:#4D453E;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:16px;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--greenbg);color:var(--green)}
.btn.red{background:var(--stamp)}
.btn.gold{background:var(--gold)}
.btn.small{padding:9px 13px;font-size:14px;width:auto;border-radius:11px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:none;margin-top:12px}
.search:focus{border-color:var(--green)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--greenbg);color:var(--green)} .pill.due{background:var(--stampbg);color:var(--stamp)}
.pill.pre{background:var(--skybg);color:var(--sky)} .pill.lun{background:var(--plumbg);color:var(--plum)}
.pill.gold{background:#F6EBD5;color:#8A6420} .pill.gray{background:#EFEAE2;color:var(--sub)} .pill.amb{background:var(--amberbg);color:var(--amber)}
.progress{height:10px;border-radius:9px;background:#EFE8DC;overflow:hidden;margin:10px 0 4px;display:flex}
.progress i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}

/* 상품 행 */
.it{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .nm{font-weight:700;font-size:15.5px;line-height:1.35}
.it .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.it .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.it .nums div{background:#F5F0E7;border-radius:10px;padding:6px 8px;font-size:11.5px;color:var(--sub)}
.it .nums b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.it .nums .neg{background:var(--stampbg)} .it .nums .neg b{color:var(--stamp)}
.it .nums .pos b{color:var(--green)}
.it.short{background:linear-gradient(90deg,var(--stampbg),transparent 70%);margin:0 -18px;padding-left:18px;padding-right:18px}
.it .iss{font-size:13px;margin-top:7px;padding:7px 10px;border-radius:10px;line-height:1.45}
.iss.bad{background:var(--stampbg);color:var(--stamp)} .iss.warn{background:var(--amberbg);color:#8A5B12} .iss.note{background:#EFEAE2;color:var(--sub)}
.ctn{display:flex;align-items:center;gap:10px;margin-top:9px;padding:10px 12px;border-radius:12px;background:var(--stamp);color:#fff}
.ctn b{font-size:20px}
.brandrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.brandrow:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px;flex:none;background:#F3E7DA;color:#8A5A2B}
.chg{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.chg:first-child{border-top:0}

/* 시트·모달 */
.dim{position:fixed;inset:0;background:rgba(30,22,15,.45);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;max-height:86dvh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
#sheet h2{font-family:var(--serif);font-size:21px;margin:0 0 4px;line-height:1.35}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);z-index:110;width:min(88vw,380px);background:var(--card);border-radius:22px;padding:24px 20px 18px;text-align:center;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#modal .stampbig{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--stamp);color:#fff;font-family:var(--serif);font-weight:700;font-size:22px;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
#modal h2{font-family:var(--serif);margin:0 0 6px;font-size:22px}
#modal p{margin:0 0 16px;color:var(--sub);font-size:15px}
textarea.mail{width:100%;min-height:180px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:14px;background:#FFFBF2;resize:vertical}

.rep{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;font-size:13.5px}
.rep .hd{border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.rep .hd b{font-family:var(--serif);font-size:19px}
.rep h4{margin:14px 0 6px;font-size:14px;display:flex;gap:6px;align-items:center}
.rep table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rep th{font-size:11.5px;color:var(--sub);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:4px 3px}
.rep td{border-bottom:1px solid #F0EAE0;padding:6px 3px;vertical-align:top;line-height:1.35}
.rep td.r,.rep th.r{text-align:right;white-space:nowrap}
.rep .bc{font-size:11px;color:var(--muted)}
.rep .ft{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);color:var(--sub);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2A2521;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="lock">
  <div class="seal">아</div>
  <h1>아케이 발주</h1>
  <p>올리브영 발주 · 재고 매칭 · 우리끼리만 봐요</p>
  <form id="lockForm" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember" checked> 이 폰에서 기억하기</label>
    <button class="btn" type="submit" id="lockBtn">들어가기</button>
  </form>
  <div id="lockErr"></div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div class="brand"><i>아</i>아케이 발주</div>
    <div class="when" id="updated"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs"><div class="in">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-tab="need"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>발주필요<span class="badge hide" id="needBadge"></span></button>
    <button data-tab="all"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 13h8M8 16h5"/></svg>전체</button>
    <button data-tab="chg"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>변동<span class="badge hide" id="chgBadge"></span></button>
    <button data-tab="ret"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>회송·미출고<span class="badge hide" id="retBadge"></span></button>
  </div></nav>
</div>
<div class="dim" id="dim"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
let KEY=null,D=null,META=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let SEL=null;
async function fetchDec(path){
  const u=new Uint8Array(await (await fetch(path,{cache:'no-store'})).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))));
}
async function load(pw){
  META=await (await fetch('meta.json',{cache:'no-store'})).json();
  KEY=await deriveKey(pw);
  D=await fetchDec('data.enc');
  if(SEL&&SEL!==D.delivery&&(META.dates||[]).includes(SEL)){try{D=await fetchDec(`archive/${SEL}.enc`)}catch(e){}}
  SEL=D.delivery;
}
async function pickDate(d){
  try{D=d===META.current?await fetchDec('data.enc'):await fetchDec(`archive/${d}.enc`);SEL=d;start(true);toast(`${md(d)} 납품분을 보여드려요`);}
  catch(e){toast('그 날짜 기록을 열지 못했어요');}
}
function eyebrow(){
  const ds=(META.dates&&META.dates.length?META.dates:[D.delivery]).slice().reverse();
  const today=new Date();today.setHours(0,0,0,0);
  const past=D.delivery&&pd(D.delivery)<today;
  return `<div class="row" style="gap:8px"><select class="dsel" onchange="pickDate(this.value)">${ds.map(d=>`<option value="${d}" ${d===D.delivery?'selected':''}>${md(d)} 납품분${d===META.current?' · 현재':''}</option>`).join('')}</select>${past?'<span class="pill gray">지난 기록</span>':''}</div>`;
}
async function unlock(pw,silent){
  const btn=$('#lockBtn'),err=$('#lockErr');
  btn.disabled=true;btn.textContent='여는 중…';err.textContent='';
  try{
    await load(pw);
    if($('#remember').checked) store.set('aky_order_pw',pw);
    PW=pw;start();
  }catch(e){
    store.del('aky_order_pw');
    if(!silent) err.textContent='비밀번호가 맞지 않아요.';
    btn.disabled=false;btn.textContent='들어가기';
  }
}
let PW=null;
const $=s=>document.querySelector(s);
document.getElementById('lockForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#pw').value.trim();if(v) unlock(v);});
const saved=store.get('aky_order_pw');if(saved) unlock(saved,true);

/* ---------- 공통 ---------- */
const n=v=>(v||0).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD='일월화수목금토';
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{if(!s)return'-';const d=pd(s);return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
async function copy(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}toast(msg||'복사했어요');}
const ST={short:['발주필요','due'],nostock:['재고 파일에 없음','due'],bad:['유통기한 불가','due'],pre:['미리 발주','amb'],tight:['미리 발주','amb'],ok:['충분','ok'],stop:['미납 처리','gray'],end:['운영중지','gray']};
const ORD=i=>i.cartons>0&&!['stop','end'].includes(i.status);
const STS=['short','nostock','bad','pre','ok','stop','end'];
const COLOR={short:'#C8402F',nostock:'#E08A7C',bad:'#7A4E86',pre:'#B7791F',tight:'#B7791F',ok:'#2F5D50',stop:'#B9AFA2',end:'#9C9285'};
const needList=()=>D.items.filter(i=>ORD(i)||i.status==='bad');

/* ---------- 시작 ---------- */
let TAB='home',FILTER='all',Q='';
function start(switching){
  $('#lock').classList.add('hide');$('#app').classList.remove('hide');
  $('#updated').innerHTML=`업데이트<br>${esc(D.built.slice(5).replace('-','.'))}`;
  const nb=needList().length;$('#needBadge').textContent=nb;$('#needBadge').classList.toggle('hide',!nb);
  const cb=D.items.filter(i=>i.change).length+D.removed.length;
  {const m=new Date().toISOString().slice(0,7);const rb=(D.returns||[]).filter(r=>r.date.slice(0,7)===m&&(r.kind||'회송')==='회송').length;$('#retBadge').textContent=rb;$('#retBadge').classList.toggle('hide',!rb);}$('#chgBadge').textContent=cb;$('#chgBadge').classList.toggle('hide',!cb);
  render();

  const sig=D.history.length?D.history[D.history.length-1].sig:D.built;

  }
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function go(t){TAB=t;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();scrollTo(0,0);}
function render(){$('#main').innerHTML=`<section class="page">${({home,need,all,chg,ret})[TAB]()}</section>`;bind();}
function bind(){
  document.querySelectorAll('[data-code]').forEach(e=>e.onclick=()=>detail(e.dataset.code));
  document.querySelectorAll('[data-brand]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();orderSheet(e.dataset.brand)});
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render();});
  const s=$('#q');if(s){s.oninput=()=>{Q=s.value;const p=s.selectionStart;render();const t=$('#q');t.focus();t.setSelectionRange(p,p);};}
}

/* ---------- 홈 ---------- */

  </div>
  <button class="card dashed" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left" onclick="report()"><span class="av" style="background:#F6EBD5;color:#8A6420">3PL</span><span class="sp"><b>3PL 실재고 확인 요청서</b><br><span class="sub" style="font-size:13.5px">부족·유통기한·번들 작업을 한 장으로 정리해요</span></span><span style="color:var(--gold);font-weight:700">열기 ›</span></button>

    <div class="sub" style="font-size:13px;margin:-6px 0 6px">발주일 재고(${esc((D.baseLabel||'').replace(/^.*_(\d{6}).*$/,'$1'))}) → 지금(${esc((D.stockLabel||'').replace(/^.*_(\d{6}).*$/,'$1'))})</div>
    ${inb.map(i=>`<button class="kv" style="width:100%;text-align:left" data-code="${i.code}"><span>${esc(i.name)}</span><b class="num">${n(i.baseStock)} → ${n(i.stock)} <span style="color:var(--green)">+${n(i.inbound)}</span></b></button>`).join('')}</div>`})()}

    ${brands.map(b=>`<div class="brandrow"><div class="av">${esc(b.brand[0]||'?')}</div><div class="sp"><b>${esc(b.brand)}</b><div class="muted" style="font-size:13px">${b.items.length}품목 · ${n(b.cartons)}카톤 (${n(b.ea)}개)</div></div><button class="btn small red" data-brand="${esc(b.brand)}">시켜야해요</button></div>`).join('')}
  </div>`:''}

function byBrand(list){
  const m={};list.filter(ORD).forEach(i=>{(m[i.brand]=m[i.brand]||{brand:i.brand,items:[],cartons:0,ea:0});m[i.brand].items.push(i);m[i.brand].cartons+=i.cartons;m[i.brand].ea+=i.orderEA;});
  return Object.values(m).sort((a,b)=>b.cartons-a.cartons);
}

/* ---------- 전체 ---------- */
const FL={all:'전체',short:'발주필요',tight:'미리 발주',ok:'충분',iss:'유통기한 이슈',on:'온라인',off:'오프라인'};
function all(){
  const q=Q.trim().toLowerCase();
  let l=D.items.filter(i=>!q||i.name.toLowerCase().includes(q)||i.code.includes(q)||i.brand.toLowerCase().includes(q));
  const f={all:()=>true,short:i=>ORD(i)&&i.status!=='pre',tight:i=>i.status==='pre'||i.status==='tight',ok:i=>i.status==='ok',iss:i=>i.issues.some(x=>x.lv!=='note'),on:i=>i.online>0,off:i=>i.offline>0}[FILTER];
  l=l.filter(f);
  return `${eyebrow()}<div class="title">전체 ${D.items.length}품목</div>
  <input class="search" id="q" placeholder="상품명·코드·브랜드 검색" value="${esc(Q)}">
  <div class="seg">${Object.entries(FL).map(([k,v])=>`<button data-f="${k}" class="${FILTER===k?'on':''}">${v}</button>`).join('')}</div>
  <div class="card">${l.length?l.map(row).join(''):'<div class="empty">조건에 맞는 품목이 없어요</div>'}</div>`;
}

/* ---------- 발주 요청 ---------- */

  const body=`안녕하세요, 아케이입니다.\n올리브영 ${md(D.delivery)} 납품분 재고가 부족하여 아래와 같이 긴급 발주 요청드립니다.\n\n`+
    b.items.map((i,k)=>`${k+1}. ${i.orderName||i.name}\n   - 바코드: ${i.orderCode||i.code}\n   - 발주: ${i.cartons}카톤 (${i.orderEA}개, 입수 ${i.unit})`).join('\n')+
    `\n\n합계 ${b.cartons}카톤 / ${b.ea}개\n납품 일정에 맞춰 입고 가능 일자 회신 부탁드립니다.\n감사합니다.`;
  sheet(`<div class="eyebrow">긴급 발주 요청</div><h2>${esc(brand)} · ${n(b.cartons)}카톤</h2>
  <div class="sub" style="font-size:14px;margin-bottom:10px">받는 사람: ${to?esc(to):'<span style="color:var(--stamp)">발주 메일 미등록 — master.csv에 추가해 주세요</span>'}</div>
  <textarea class="mail" id="mailBody">${esc(body)}</textarea>
  <button class="btn red" style="margin-top:12px" id="mailGo">메일 앱으로 보내기</button>
  <div class="row" style="margin-top:8px"><button class="btn ghost" id="mailCopy">내용 복사</button><button class="btn gold" id="poDown">발주서 엑셀(CSV)</button></div>
  <div class="note" style="margin-top:12px;font-size:13.5px">메일 앱이 열리면 받는 사람·제목·내용이 채워져 있어요. 발주서 파일은 [발주서 엑셀]로 받아서 첨부해 주세요.</div>`);

  $('#poDown').onclick=()=>{

    const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`발주서_${brand}_${(D.delivery||'').replace(/-/g,'')}.csv`;a.click();

/* ---------- 회송·미출고 ---------- */
let RETM=null,RETK='all';
const rmon=()=>{const ms=[...new Set((D.returns||[]).map(r=>r.date.slice(0,7)))].sort().reverse();if(!RETM||!ms.includes(RETM))RETM=ms[0]||null;return ms;};
const KIND=r=>r.kind||'회송';
function retCard(){
  const ms=rmon();if(!ms.length)return '';
  const cur=new Date().toISOString().slice(0,7),rs=(D.returns||[]).filter(r=>r.date.slice(0,7)===cur);
  const rt=rs.filter(r=>KIND(r)==='회송'),mi=rs.filter(r=>KIND(r)==='미출고');
  const last=(D.returns||[]).find(r=>KIND(r)==='회송');
  return `<button class="card" style="display:block;width:100%;text-align:left;border:1.5px solid var(--stampbg)" onclick="go('ret')">
   <h3>회송 · 미출고 <span class="row" style="gap:4px"><span class="pill due">회송 ${rt.length}</span><span class="pill amb">미출고 ${mi.length}</span></span></h3>
   <div class="sub" style="font-size:14px">이번 달 · 회송 ${n(rt.reduce((a,r)=>a+r.returned,0))}개(${rt.reduce((a,r)=>a+(r.cartons||0),0)}카톤) · 미출고 ${n(mi.reduce((a,r)=>a+r.returned,0))}개(${mi.reduce((a,r)=>a+(r.cartons||0),0)}카톤)</div>
   ${last?`<div class="iss bad" style="margin-top:8px">최근 회송 ${+last.date.slice(5,7)}/${+last.date.slice(8)} ${esc(last.name)} ${n(last.returned)}개 — ${esc(last.reason)}</div>`:''}
   <div style="margin-top:8px;color:var(--green);font-weight:600;font-size:13px">리스트 보기 ›</div></button>`;
}
function ret(){
  const ms=rmon();
  const all=(D.returns||[]).filter(r=>r.date.slice(0,7)===RETM);
  const rs=all.filter(r=>RETK==='all'||KIND(r)===RETK);
  const rt=all.filter(r=>KIND(r)==='회송'),mi=all.filter(r=>KIND(r)==='미출고');
  const byR={};rs.forEach(r=>{const k=KIND(r)+' · '+r.reason.replace(/\s*\(.*\)$/,'');byR[k]=(byR[k]||0)+1;});
  const ml=m=>`${+m.slice(2,4)}년 ${+m.slice(5)}월`;
  const sumQ=a=>n(a.reduce((x,r)=>x+r.returned,0)),sumC=a=>a.reduce((x,r)=>x+(r.cartons||0),0),sumL=a=>n(a.reduce((x,r)=>x+(r.lost||0),0));
  return `<div class="row" style="gap:8px"><select class="dsel" onchange="RETM=this.value;render()">${ms.map(m=>`<option value="${m}" ${m===RETM?'selected':''}>${ml(m)}</option>`).join('')||'<option>기록 없음</option>'}</select></div>
  <div class="title" style="margin-top:10px">회송 · 미출고</div>
  <div class="sub" style="font-size:13.5px"><b>회송</b> = 납품하러 갔다가 검수에서 돌려받음 · <b>미출고</b> = 처음부터 0으로 넣어 납품 안 함</div>
  <div class="card hero alert"><div class="wm">회송</div>
    <div style="font-size:13.5px;opacity:.85">${RETM?ml(RETM):''} 못 들어간 수량</div>
    <div class="big num">${n(all.reduce((a,r)=>a+r.returned,0))}<small>개</small> · ${sumC(all)}<small>카톤</small></div>
    <div class="stats"><div>회송<b>${rt.length}건 · ${sumQ(rt)}개</b></div><div>미출고<b>${mi.length}건 · ${sumQ(mi)}개</b></div><div>놓친 매출<b>${sumL(all)}원</b></div></div>
  </div>
  <div class="seg">${[['all','전체 '+all.length],['회송','회송 '+rt.length],['미출고','미출고 '+mi.length]].map(([k,v])=>`<button class="${RETK===k?'on':''}" onclick="RETK='${k}';render()">${v}</button>`).join('')}</div>
  ${Object.keys(byR).length?`<div class="card"><h3>사유별</h3>${Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b class="num">${v}건</b></div>`).join('')}</div>`:''}
  <div class="card">${rs.map(r=>{const rv=KIND(r)==='회송';return `<div class="it">
    <div class="row" style="align-items:flex-start"><div class="sp nm">${esc(r.name)}</div><span class="pill ${rv?'due':'amb'}">${KIND(r)}</span></div>
    <div class="meta num">${+r.date.slice(5,7)}/${+r.date.slice(8)} (${WD[pd(r.date).getDay()]}) 입고 · ${esc(r.center)} · ${r.code}</div>
    <div class="nums" style="grid-template-columns:repeat(3,1fr)">${rv?`<div>납품 시도<b>${n(r.tried)}</b></div><div>납품됨<b>${n(r.delivered)}</b></div><div class="neg">회송<b>${n(r.returned)}개 · ${r.cartons??'-'}카톤</b></div>`:`<div>발주<b>${n(r.po||r.tried)}</b></div><div>납품 시도<b>0</b></div><div class="neg">미출고<b>${n(r.returned)}개 · ${r.cartons??'-'}카톤</b></div>`}</div>
    <div class="iss ${rv?'bad':'warn'}"><b>사유</b> · ${esc(r.reason)}${r.memo?`<div style="color:var(--sub);font-size:12.5px;margin-top:2px">${esc(r.memo)}</div>`:''}</div>
    <div class="muted" style="font-size:11.5px;margin-top:4px">놓친 매출 ${r.lost?n(r.lost)+'원':'단가 확인 전'} · 근거: ${esc(r.source||'올리브원 납품확인서')}</div></div>`}).join('')||'<div class="empty">해당 내역이 없어요</div>'}</div>
  <div class="note"><b>회송</b>은 올리브원 납품예정수량 − 검수 확정 납품수량이고, 사유는 CJ 납품완료보고서 검수자 수기 메모예요. <b>미출고</b>는 발주는 떴지만 납품예정수량을 0으로 넣은 품목이에요. 미출고는 우리 기준으로 "미출고"만 표시해요(운영중지로 정해둔 품목은 운영중지로 표시).</div>`;
}

/* ---------- 3PL 확인 요청서 ---------- */
function report(){
  const it=D.items.filter(i=>!['stop','end'].includes(i.status));
  const prevDay=(()=>{const d=pd(D.delivery);d.setDate(d.getDate()-1);return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`})();
  const stockChk=it.filter(i=>ORD(i)||i.status==='nostock');
  const expChk=it.filter(i=>i.issues.some(x=>x.lv==='bad'||x.lv==='warn'));
  const bundle=it.filter(i=>i.mult>1);
  const short=t=>t.replace(/\s*\(임의 입력.*?\)/,'').replace(/^유통기한 /,'');
  const nm=i=>`${esc(i.name)}<div class="bc">${i.code}</div>`;
  const html=`<div class="rep" id="repBox">
   <div class="hd"><b>3PL 실재고 확인 요청</b><div class="sub" style="font-size:12.5px">아케이 · 올리브영 ${md(D.delivery)} 납품분 · 작성 ${esc(D.built.slice(5))}</div></div>
   ${stockChk.length?`<h4><span class="pill due">${stockChk.length}</span> 재고 부족·소진 예정 — 실재고 확인 부탁드려요</h4>
   <table><tr><th>상품</th><th class="r">발주</th><th class="r">전산재고</th><th class="r">실재고</th></tr>
   ${stockChk.map(i=>`<tr><td>${nm(i)}</td><td class="r">${n(i.total)}</td><td class="r">${n(i.stock)}</td><td class="r" style="color:var(--line)">______</td></tr>`).join('')}</table>`:''}
   ${expChk.length?`<h4><span class="pill lun">${expChk.length}</span> 유통기한 확인 — 실제 유통기한 회신 부탁드려요</h4>
   <table><tr><th>상품</th><th>전산 확인 내용</th></tr>
   ${expChk.map(i=>`<tr><td>${nm(i)}</td><td>${i.issues.filter(x=>x.lv!=='note').map(x=>esc(short(x.t))).join('<br>')}</td></tr>`).join('')}</table>`:''}
   ${bundle.length?`<h4><span class="pill gold">${bundle.length}</span> 번들 작업 요청</h4>
   <table><tr><th>상품</th><th class="r">세트</th><th class="r">단품 필요</th></tr>
   ${bundle.map(i=>`<tr><td>${nm(i)}</td><td class="r">${n(i.total)}</td><td class="r">${n(i.total*i.mult)}개 (×${i.mult})</td></tr>`).join('')}</table>`:''}
   ${!stockChk.length&&!expChk.length&&!bundle.length?'<div class="empty">이번 납품분은 확인할 내용이 없어요</div>':''}
   <div class="ft">실재고·유통기한(제조일) 확인 후 <b>${prevDay} 17:00까지</b> 회신 부탁드립니다. 유통기한이 2가지 이상 섞인 품목도 알려주세요.</div>
  </div>`;
  const txt=[`[3PL 실재고 확인 요청] 아케이 · 올리브영 ${md(D.delivery)} 납품분`,
    stockChk.length?'\n■ 재고 부족·소진 예정 (실재고 확인)\n'+stockChk.map(i=>`- ${i.name} (${i.code}) 발주 ${i.total} / 전산재고 ${i.stock} → 실재고: `).join('\n'):'',
    expChk.length?'\n■ 유통기한 확인\n'+expChk.map(i=>`- ${i.name} (${i.code}): `+i.issues.filter(x=>x.lv!=='note').map(x=>short(x.t)).join(' / ')).join('\n'):'',
    bundle.length?'\n■ 번들 작업\n'+bundle.map(i=>`- ${i.name}: ${i.total}세트 = 단품 ${i.total*i.mult}개`).join('\n'):'',
    `\n${prevDay} 17:00까지 회신 부탁드립니다.`].filter(Boolean).join('\n');
  sheet(html+`<div class="row" style="margin-top:12px"><button class="btn ghost" id="repCopy">텍스트로 복사</button><button class="btn" onclick="closeAll()">닫기</button></div><div class="muted" style="font-size:12.5px;text-align:center;margin-top:8px">이 화면을 캡처해서 3PL 담당자에게 보내주세요</div>`,true);
  $('#repCopy').onclick=()=>copy(txt,'요청서 내용을 복사했어요');
}

/* ---------- 시트/모달 ---------- */
function sheet(h,full){$('#sheet').style.maxHeight=full?'100dvh':'';$('#sheetBody').innerHTML=h;$('#sheet').scrollTop=0;$('#sheet').classList.add('on');$('#dim').classList.add('on');}
function modal(h){$('#modal').innerHTML=h;$('#modal').classList.add('on');$('#dim').classList.add('on');}
function closeAll(){$('#sheet').classList.remove('on');$('#modal').classList.remove('on');$('#dim').classList.remove('on');}
$('#dim').onclick=closeAll;
// 5분마다 새 데이터 확인
setInterval(async()=>{if(!PW)return;try{const m=await (await fetch('meta.json',{cache:'no-store'})).json();if(m.built!==META.built){await load(PW);start();toast('새 발주 정보로 업데이트했어요');}}catch(e){}},300000);
</script>
</body>
</html>
