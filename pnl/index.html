<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="올영 손익">
<title>올영 손익</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F6F1E8; --card:#FFFDF9; --ink:#2A2521; --sub:#6F655B; --muted:#9C9285; --line:#E7DED0;
  --green:#2F5D50; --green2:#3E7564; --greenbg:#E6EEE9; --stamp:#C8402F; --stampbg:#FBE9E5;
  --amber:#B7791F; --amberbg:#FBF0DC; --gold:#B98B3E; --sky:#3B6E9C; --skybg:#E5EEF6; --plum:#7A4E86; --plumbg:#F1E8F3;
  --r:18px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(rgba(120,90,50,.035) 1px,transparent 1px);background-size:4px 4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center}
#lock .seal{width:84px;height:84px;border-radius:22px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:40px;font-weight:700;box-shadow:0 10px 30px rgba(47,93,80,.3);transform:rotate(-4deg)}
#lock h1{font-family:var(--serif);font-size:36px;margin:26px 0 4px;letter-spacing:.04em}
#lock p{color:var(--sub);margin:0 0 30px;font-size:15px}
#lock form{width:100%;max-width:320px}
#lock input[type=password]{width:100%;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:18px;text-align:center;letter-spacing:.15em;outline:none}
#lock input[type=password]:focus{border-color:var(--green)}
#lock .remember{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 18px;color:var(--sub);font-size:14px}
#lockErr{color:var(--stamp);font-size:14px;min-height:22px;margin-top:12px}

#app{max-width:560px;margin:0 auto;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(246,241,232,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top .brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:9px}
header.top .brand i{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font-style:normal;display:grid;place-items:center;font-size:16px;transform:rotate(-4deg)}
header.top .when{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(255,253,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--green)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--stamp);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:17px;font-weight:700}
section.page{padding:4px 16px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.dsel{appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%23B98B3E%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E") no-repeat right 12px center;color:var(--gold);font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;padding:7px 34px 7px 13px;border-radius:99px;outline:none}
.title{font-family:var(--serif);font-size:26px;margin:6px 0 2px;font-weight:700}
.muted{color:var(--muted)} .sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0;border:1px solid rgba(231,222,208,.6)}
.card h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .more{font-size:13px;color:var(--green);font-weight:600}
.card.hero{background:linear-gradient(135deg,#2F5D50,#24493F);color:#fff;border:0;position:relative;overflow:hidden}
.card.hero.alert{background:linear-gradient(135deg,#B5432F,#8F2F22)}
.card.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.card.hero .big small{font-size:17px;font-weight:700;margin-left:3px;opacity:.85}
.card.hero .stats{display:flex;gap:7px}
.card.hero .stats div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:9px;font-size:11.5px;min-width:0}
.card.hero .stats b{display:block;font-size:14px;white-space:nowrap}
.card.hero .wm{position:absolute;right:-10px;bottom:-34px;font-family:var(--serif);font-size:130px;font-weight:700;opacity:.07;pointer-events:none}
.card.dashed{border:1.5px dashed var(--gold);background:#FFFBF2}
.note{background:#F3EEE6;border-radius:14px;padding:14px 15px;font-size:14.5px;color:#4D453E;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:16px;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--greenbg);color:var(--green)}
.btn.red{background:var(--stamp)}
.btn.gold{background:var(--gold)}
.btn.small{padding:9px 13px;font-size:14px;width:auto;border-radius:11px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:none;margin-top:12px}
.search:focus{border-color:var(--green)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--greenbg);color:var(--green)} .pill.due{background:var(--stampbg);color:var(--stamp)}
.pill.pre{background:var(--skybg);color:var(--sky)} .pill.lun{background:var(--plumbg);color:var(--plum)}
.pill.gold{background:#F6EBD5;color:#8A6420} .pill.gray{background:#EFEAE2;color:var(--sub)} .pill.amb{background:var(--amberbg);color:var(--amber)}
.progress{height:10px;border-radius:9px;background:#EFE8DC;overflow:hidden;margin:10px 0 4px;display:flex}
.progress i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}

/* 시트·모달 */
.dim{position:fixed;inset:0;background:rgba(30,22,15,.45);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;max-height:86dvh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
#sheet h2{font-family:var(--serif);font-size:21px;margin:0 0 4px;line-height:1.35}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);z-index:110;width:min(88vw,380px);background:var(--card);border-radius:22px;padding:24px 20px 18px;text-align:center;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#modal .stampbig{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--stamp);color:#fff;font-family:var(--serif);font-weight:700;font-size:22px;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
#modal h2{font-family:var(--serif);margin:0 0 6px;font-size:22px}
#modal p{margin:0 0 16px;color:var(--sub);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2A2521;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
/* 손익 전용 */
:root{--j:#B8862F;--o:#1F8A65}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 11px;font-size:12px}
.kpi b{display:block;font-size:19px;letter-spacing:-.01em;margin-top:1px}
.delta{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16);margin-left:6px;vertical-align:middle}
.provnote{margin-top:12px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.5);border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.5}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#2A2521;color:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
.chart .tip.on{opacity:1}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:4px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.br{padding:11px 0;border-top:1px solid var(--line)}
.br:first-child{border-top:0}
.br .top{display:flex;align-items:baseline;gap:8px}
.br .top b{font-size:15.5px}
.br .bar{height:8px;border-radius:6px;background:#EFE8DC;margin-top:7px;overflow:hidden}
.br .bar i{display:block;height:100%;border-radius:6px;background:var(--o)}
.br .sm{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px}
.neg{color:var(--stamp)!important}
.dl{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dl:first-child{border-top:0}
.dl .d{width:48px;text-align:center;flex:none}
.dl .d small{display:block;font-size:11px;color:var(--muted)}
.dl .d b{font-size:20px;font-family:var(--serif)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.mini div{background:#F5F0E7;border-radius:10px;padding:8px;font-size:11.5px;color:var(--sub)}
.mini b{display:block;font-size:15px;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{color:var(--sub);font-weight:600;font-size:11.5px;text-align:right;padding:5px 3px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:6px 3px;border-bottom:1px solid #F0EAE0}
table.t th:first-child,table.t td:first-child{text-align:left}
</style>
</head>
<body>
<div id="lock">
  <div class="seal">익</div>
  <h1>올영 손익</h1>
  <p>올리브영 매출 · 마진 · 브랜드별 손익</p>
  <form id="lockForm" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember" checked> 이 폰에서 기억하기</label>
    <button class="btn" type="submit" id="lockBtn">들어가기</button>
  </form>
  <div id="lockErr"></div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div class="brand"><i>익</i>올영 손익</div>
    <div class="when" id="updated"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs"><div class="in">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>이번 달</button>
    <button data-tab="trend"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>월별</button>
    <button data-tab="brand"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>브랜드</button>
    <button data-tab="deliv"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>납품건</button>
    <button data-tab="ret"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>회송<span class="badge hide" id="retBadge"></span></button>
  </div></nav>
</div>
<div class="dim" id="dim"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
'use strict';
let KEY=null,D=null,META=null,PW=null;
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function load(pw){
  META=await (await fetch('meta.json',{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const u=new Uint8Array(await (await fetch('data.enc',{cache:'no-store'})).arrayBuffer());
  D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))));
}
async function unlock(pw,silent){
  const btn=$('#lockBtn');btn.disabled=true;btn.textContent='여는 중…';$('#lockErr').textContent='';
  try{await load(pw);if($('#remember').checked)store.set('aky_pnl_pw',pw);PW=pw;start();}
  catch(e){store.del('aky_pnl_pw');if(!silent)$('#lockErr').textContent='비밀번호가 맞지 않아요.';btn.disabled=false;btn.textContent='들어가기';}
}
$('#lockForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#pw').value.trim();if(v)unlock(v);});
{const s=store.get('aky_pnl_pw');if(s)unlock(s,true);}

/* ---------- 숫자 ---------- */
const won=v=>{v=Math.round(v||0);const a=Math.abs(v),s=v<0?'−':'';
  if(a>=1e8)return s+(a/1e8).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+'억';
  if(a>=1e4)return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만';return s+a.toLocaleString('ko-KR');};
const full=v=>Math.round(v||0).toLocaleString('ko-KR')+'원';
const pct=(a,b)=>b?(a/b*100):0;
const p1=v=>(Math.round(v*10)/10).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD='일월화수목금토';
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ml=m=>`${+m.slice(2,4)}년 ${+m.slice(5)}월`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}

/* ---------- 상태 ---------- */
let TAB='home',MON=null,EXJ=false;
const MAIN='조선미녀';
const rowsOf=m=>D.rows.filter(r=>r.month===m&&(!EXJ||r.brand!==MAIN));
function sum(rs){const o={salesT:0,costT:0,edi:0,logi:0,margin:0,provS:0,provM:0,n:rs.length};
  rs.forEach(r=>{o.salesT+=r.salesT;o.costT+=r.costT;o.edi+=r.edi;o.logi+=r.logi;o.margin+=r.margin;if(r.status==='가'){o.provS+=r.salesT;o.provM+=r.margin;}});return o;}
function start(){
  $('#lock').classList.add('hide');$('#app').classList.remove('hide');
  $('#updated').innerHTML=`업데이트<br>${esc(D.built.slice(5).replace('-','.'))}`;
  MON=MON||D.months[D.months.length-1].m;
  const rb=(D.returns||[]).filter(r=>r.date.slice(0,7)===D.months[D.months.length-1].m).length;$('#retBadge').textContent=rb;$('#retBadge').classList.toggle('hide',!rb);
  render();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0);});
function render(){$('#main').innerHTML=`<section class="page">${({home,trend,brand,deliv,ret})[TAB]()}</section>`;bind();}
function bind(){
  const s=$('#msel');if(s)s.onchange=()=>{MON=s.value;render();};
  document.querySelectorAll('[data-exj]').forEach(b=>b.onclick=()=>{EXJ=b.dataset.exj==='1';render();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>dayDetail(b.dataset.day));
  document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>brandDetail(b.dataset.brand));
  const c=$('#trendChart');if(c)drawTrend(c);
}
function controls(withMonth=true){
  const ms=D.months.map(x=>x.m).slice().reverse();
  const hasJ=withMonth?D.rows.some(r=>r.month===MON&&r.brand===MAIN):true;
  if(!hasJ)EXJ=false;
  return `<div class="row" style="gap:8px;flex-wrap:wrap">${withMonth?`<select class="dsel" id="msel">${ms.map(m=>`<option value="${m}" ${m===MON?'selected':''}>${ml(m)}</option>`).join('')}</select>`:''}
  ${hasJ?'':'<!--'}<div class="seg" style="margin:0;padding:0">${[['0','전체'],['1','조선미녀 제외']].map(([k,v])=>`<button data-exj="${k}" class="${(EXJ?'1':'0')===k?'on':''}">${v}</button>`).join('')}</div>${hasJ?'':'-->'}</div>`;
}

/* ---------- 이번 달 ---------- */
function home(){
  const cur=sum(rowsOf(MON)),i=D.months.findIndex(x=>x.m===MON),prev=i>0?sum(rowsOf(D.months[i-1].m)):null;
  const dS=prev&&prev.salesT?pct(cur.salesT-prev.salesT,Math.abs(prev.salesT)):null;
  const br=brands(rowsOf(MON)).slice(0,5);
  const ch=channels(rowsOf(MON));
  const maxB=Math.max(1,...br.map(b=>b.salesT));
  return `${controls()}
  <div class="title" style="margin-top:12px">${ml(MON)} 올영 손익</div>
  <div class="sub" style="font-size:13.5px">${EXJ?'조선미녀를 뺀 나머지 브랜드 기준':D.rows.some(r=>r.month===MON&&r.brand===MAIN)?'전체 브랜드 기준':'전체 브랜드 기준 (조선미녀 계약 종료 이후)'} · 부가세 포함 금액</div>
  <div class="card hero">
    <div class="wm">손익</div>
    <div style="font-size:13.5px;opacity:.85">매출 (올리브영 납품액)${cur.provS?' · 가매출 포함':''}</div>
    <div class="big num">${won(cur.salesT)}<small>원</small>${dS!==null?`<span class="delta">전월 ${dS>=0?'▲':'▼'} ${p1(Math.abs(dS))}</span>`:''}</div>
    <div class="kpi">
      <div>마진<b class="num">${won(cur.margin)}원</b></div>
      <div>마진율 (매출 대비)<b class="num">${p1(pct(cur.margin,cur.salesT))}</b></div>
      <div>매입 원가<b class="num">${won(cur.costT)}원</b></div>
      <div>EDI·물류 수수료<b class="num">${won(cur.edi+cur.logi)}원</b></div>
    </div>
    ${cur.provS?`<div class="provnote"><b>가매출 ${won(cur.provS)}원 포함</b> — 발주 수량을 <b>전부 납품했다고 가정</b>한 금액이에요. 납품일 저녁 확정 수량이 나오면 <b>실매출로 수정</b>돼요.</div>`:''}
  </div>
  <div class="card"><h3>매출 상위 브랜드 <span class="more" onclick="document.querySelector('[data-tab=brand]').click()">전체 ›</span></h3>
    ${br.map(b=>brandRow(b,maxB)).join('')||'<div class="empty">이 달 매출이 없어요</div>'}
  </div>
  ${(()=>{const rs=(D.returns||[]).filter(r=>r.date.slice(0,7)===MON);if(!rs.length)return '';const q=rs.reduce((a,r)=>a+r.returned,0),l=rs.reduce((a,r)=>a+r.lost,0);
   return `<button class="card" style="display:block;width:100%;text-align:left;border:1.5px solid var(--stampbg)" onclick="document.querySelector('[data-tab=ret]').click()">
   <h3>이번 달 회송 <span class="pill due">${rs.length}건</span></h3>
   <div class="mini"><div>회송 수량<b class="num">${q.toLocaleString('ko-KR')}개</b></div><div>회송 카톤<b class="num">${rs.reduce((a,r)=>a+(r.cartons||0),0)}</b></div><div>놓친 매출<b class="num neg">${won(l)}</b></div></div>
   ${rs.slice(0,3).map(r=>`<div class="sm" style="margin-top:8px;font-size:13px;color:var(--sub)"><b style="color:var(--ink)">${+r.date.slice(5,7)}/${+r.date.slice(8)}</b> ${esc(r.name)} — <span style="color:var(--stamp)">${esc(r.reason)}</span></div>`).join('')}
   <div class="more" style="margin-top:8px;color:var(--green);font-weight:600;font-size:13px">회송 리스트 보기 ›</div></button>`})()}
  <div class="card"><h3>채널별</h3>
    <table class="t"><tr><th>채널</th><th>매출</th><th>마진</th><th>마진율</th></tr>
    ${ch.map(c=>`<tr><td>${esc(c.k)}</td><td>${won(c.salesT)}</td><td class="${c.margin<0?'neg':''}">${won(c.margin)}</td><td class="${c.margin<0?'neg':''}">${p1(pct(c.margin,c.salesT))}</td></tr>`).join('')}</table>
  </div>
  <div class="note">마진 = 매출 − 매입 원가 − EDI 사용료(4%) − 물류 대행 수수료(오프라인 4%). 손익 구글시트와 같은 기준이고, 비용(인건비·임대료 등)은 아직 빠져 있어요. 시트의 마진율은 <b>매입 대비</b>라서 이 화면(매출 대비)보다 높게 보여요: 이번 달 매입 대비 ${p1(pct(cur.margin,cur.costT))}.</div>`;
}
function brands(rs){const m={};rs.forEach(r=>{const o=m[r.brand]=m[r.brand]||{brand:r.brand,salesT:0,margin:0,costT:0,prov:0};o.salesT+=r.salesT;o.margin+=r.margin;o.costT+=r.costT;if(r.status==='가')o.prov+=r.salesT;});return Object.values(m).filter(b=>b.salesT||b.margin).sort((a,b)=>b.salesT-a.salesT);}
function channels(rs){const m={};rs.forEach(r=>{const k=r.kind==='정기'?(r.center==='온라인'?'정기 · 온라인':r.center==='오프라인'?'정기 · 오프라인':'정기 · '+r.center):r.kind==='직납'?'직납':'반품·테스터·기타';const o=m[k]=m[k]||{k,salesT:0,margin:0};o.salesT+=r.salesT;o.margin+=r.margin;});return Object.values(m).filter(c=>Math.round(c.salesT)||Math.round(c.margin)).sort((a,b)=>b.salesT-a.salesT);}
function brandRow(b,max){return `<button class="br" style="display:block;width:100%;text-align:left" data-brand="${esc(b.brand)}">
  <div class="top"><b>${esc(b.brand)}</b>${b.prov?'<span class="pill amb">가매출</span>':''}<span class="sp"></span><b class="num">${won(b.salesT)}</b></div>
  <div class="bar"><i style="width:${Math.max(0,b.salesT/max*100)}%;${b.brand===MAIN?'background:var(--j)':''}"></i></div>
  <div class="sm"><span>마진 <b class="num ${b.margin<0?'neg':''}" style="color:var(--ink)">${won(b.margin)}</b></span><span>마진율 <b class="num ${b.margin<0?'neg':''}" style="color:var(--ink)">${p1(pct(b.margin,b.salesT))}</b></span></div></button>`;}

/* ---------- 월별 ---------- */
function trend(){
  const ms=D.months;
  return `${controls(false)}
  <div class="title" style="margin-top:12px">월별 매출 추이</div>
  <div class="card"><h3>매출 <span class="muted" style="font-size:12.5px;font-weight:500">막대를 누르면 금액이 보여요</span></h3>
    <div class="chart" id="trendChart"></div>
    ${EXJ?'':`<div class="lg"><span style="--c:var(--j)">조선미녀</span><span style="--c:var(--o)">그 외 브랜드</span></div>`}
  </div>
  <div class="card"><h3>월별 표</h3>
    <table class="t"><tr><th>월</th><th>매출</th><th>마진</th><th>마진율</th></tr>
    ${ms.slice().reverse().map(x=>{const s=sum(rowsOf(x.m));return `<tr><td>${ml(x.m)}${s.provS?' <span class="pill amb" style="font-size:10.5px;padding:1px 6px">가</span>':''}</td><td>${won(s.salesT)}</td><td class="${s.margin<0?'neg':''}">${won(s.margin)}</td><td>${p1(pct(s.margin,s.salesT))}</td></tr>`}).join('')}</table>
  </div>
  <div class="note">조선미녀는 11월 계약 종료로 빠졌어요. [조선미녀 제외]를 누르면 앞으로 키워갈 나머지 브랜드만의 흐름을 볼 수 있어요.</div>`;
}
function drawTrend(el){
  const ms=D.months,W=360,H=210,L=34,B=24,T=10,R=4;
  const data=ms.map(x=>{const rs=D.rows.filter(r=>r.month===x.m);const j=rs.filter(r=>r.brand===MAIN).reduce((a,r)=>a+r.salesT,0);const o=rs.filter(r=>r.brand!==MAIN).reduce((a,r)=>a+r.salesT,0);return{m:x.m,j:EXJ?0:Math.max(0,j),o:Math.max(0,o)}});
  const max=Math.max(1,...data.map(d=>d.j+d.o));const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=Math.ceil(max/step)*step;
  const bw=(W-L-R)/data.length,y=v=>T+(H-T-B)*(1-v/nice);
  let g='';for(let k=0;k<=4;k++){const v=nice*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E7DED0" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="9.5" fill="#9C9285">${won(v)}</text>`;}
  let bars='';data.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;
    const yo=y(d.o),yj=y(d.o+d.j);
    if(d.o>0)bars+=`<rect x="${x}" y="${yo}" width="${w}" height="${Math.max(0,y(0)-yo)}" rx="3" fill="var(--o)"/>`;
    if(d.j>0)bars+=`<rect x="${x}" y="${yj}" width="${w}" height="${Math.max(0,yo-yj-2)}" rx="3" fill="var(--j)"/>`;
    bars+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
    if(i%2===(data.length-1)%2)bars+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#9C9285">${+d.m.slice(5)}월</text>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 매출 막대 그래프">${g}${bars}</svg><div class="tip"></div>`;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(h=>{const show=()=>{const d=data[+h.dataset.i];const r=el.getBoundingClientRect(),hb=h.getBoundingClientRect();
    tip.innerHTML=`<b>${ml(d.m)}</b><br>${EXJ?'':`조선미녀 ${won(d.j)}<br>`}그 외 ${won(d.o)}<br>합계 ${won(d.j+d.o)}`;
    tip.style.left=Math.min(Math.max(hb.left-r.left+hb.width/2,60),r.width-60)+'px';tip.style.top=(y(d.j+d.o)/H*r.height-6)+'px';tip.classList.add('on');};
    h.addEventListener('mouseenter',show);h.addEventListener('click',show);h.addEventListener('mouseleave',()=>tip.classList.remove('on'));});
}

/* ---------- 브랜드 ---------- */
function brand(){
  const br=brands(rowsOf(MON)),max=Math.max(1,...br.map(b=>b.salesT));
  return `${controls()}<div class="title" style="margin-top:12px">브랜드별 손익</div>
  <div class="card">${br.map(b=>brandRow(b,max)).join('')||'<div class="empty">이 달 매출이 없어요</div>'}</div>`;
}
function brandDetail(name){
  const ms=D.months.map(x=>{const s=sum(D.rows.filter(r=>r.month===x.m&&r.brand===name));return{m:x.m,...s}}).filter(x=>x.salesT||x.margin);
  sheet(`<div class="eyebrow">브랜드</div><h2>${esc(name)}</h2>
  <table class="t" style="margin-top:10px"><tr><th>월</th><th>매출</th><th>마진</th><th>마진율</th></tr>
  ${ms.slice().reverse().map(x=>`<tr><td>${ml(x.m)}${x.provS?' <span class="pill amb" style="font-size:10.5px;padding:1px 6px">가</span>':''}</td><td>${won(x.salesT)}</td><td class="${x.margin<0?'neg':''}">${won(x.margin)}</td><td>${p1(pct(x.margin,x.salesT))}</td></tr>`).join('')}</table>`);
}

/* ---------- 납품건 ---------- */
function deliv(){
  const rs=rowsOf(MON),m={};
  rs.forEach(r=>{const k=r.inb||r.po||'날짜 없음';(m[k]=m[k]||[]).push(r);});
  const days=Object.keys(m).sort().reverse();
  return `${controls()}<div class="title" style="margin-top:12px">납품건별 손익</div>
  <div class="sub" style="font-size:13.5px">입고일 기준 · 누르면 브랜드별로 보여요</div>
  <div class="card">${days.map(k=>{const s=sum(m[k]);const d=k.match(/^\d{4}-/)?pd(k):null;const prov=m[k].some(r=>r.status==='가');
   return `<button class="dl" data-day="${k}"><div class="d">${d?`<small>${d.getMonth()+1}월 ${WD[d.getDay()]}</small><b>${d.getDate()}</b>`:'<b>-</b>'}</div>
   <div class="sp"><div class="row" style="gap:6px"><b class="num">${won(s.salesT)}원</b>${prov?'<span class="pill amb">가매출</span>':'<span class="pill ok">실매출</span>'}</div>
   <div class="muted" style="font-size:12.5px">${[...new Set(m[k].map(r=>r.brand))].slice(0,4).map(esc).join(' · ')}${new Set(m[k].map(r=>r.brand)).size>4?' 외':''}</div></div>
   <div style="text-align:right"><div class="num ${s.margin<0?'neg':''}" style="font-weight:700">${won(s.margin)}</div><div class="muted" style="font-size:12px">마진 ${p1(pct(s.margin,s.salesT))}</div></div></button>`}).join('')||'<div class="empty">이 달 납품건이 없어요</div>'}</div>
  <div class="note"><b>가매출</b>은 발주 수량을 전부 납품한다고 가정한 금액이에요. 납품일(화·목) 저녁 확정 수량이 나오면 <b>실매출</b>로 바뀌어요.</div>`;
}
function dayDetail(k){
  const rs=rowsOf(MON).filter(r=>(r.inb||r.po||'날짜 없음')===k),s=sum(rs),prov=rs.some(r=>r.status==='가');
  sheet(`<div class="eyebrow">${k.match(/^\d{4}-/)?`${+k.slice(5,7)}월 ${+k.slice(8)}일 (${WD[pd(k).getDay()]}) 입고`:esc(k)}</div><h2>${won(s.salesT)}원 ${prov?'<span class="pill amb">가매출</span>':'<span class="pill ok">실매출</span>'}</h2>
  ${prov?'<div class="note" style="margin:8px 0">전부 납품했다고 가정한 금액이에요. 납품 후 확정 수량으로 수정될 예정이에요.</div>':''}
  <div class="mini"><div>마진<b class="num ${s.margin<0?'neg':''}">${won(s.margin)}</b></div><div>매입 원가<b class="num">${won(s.costT)}</b></div><div>EDI·물류<b class="num">${won(s.edi+s.logi)}</b></div></div>
  <table class="t" style="margin-top:12px"><tr><th>브랜드</th><th>매출</th><th>마진</th><th>마진율</th></tr>
  ${rs.slice().sort((a,b)=>b.salesT-a.salesT).map(r=>`<tr><td>${esc(r.brand)} <span class="muted" style="font-size:11px">${esc(r.center)}</span></td><td>${won(r.salesT)}</td><td class="${r.margin<0?'neg':''}">${won(r.margin)}</td><td>${p1(pct(r.margin,r.salesT))}</td></tr>`).join('')}</table>`);
}


/* ---------- 회송 ---------- */
function ret(){
  const all=D.returns||[];
  const rs=all.filter(r=>r.date.slice(0,7)===MON);
  const q=rs.reduce((a,r)=>a+r.returned,0),l=rs.reduce((a,r)=>a+r.lost,0);
  const byR={};rs.forEach(r=>{const k=r.reason.replace(/\s*\(.*\)$/,'');byR[k]=(byR[k]||0)+1;});
  return `${controls()}<div class="title" style="margin-top:12px">회송 리스트</div>
  <div class="sub" style="font-size:13.5px">납품하려다 검수에서 돌려받은 품목 · 납품예정수량 − 실제 납품수량</div>
  <div class="card hero alert"><div class="wm">회송</div>
    <div style="font-size:13.5px;opacity:.85">${ml(MON)} 회송</div>
    <div class="big num">${rs.length}<small>건</small> · ${q.toLocaleString('ko-KR')}<small>개</small></div>
    <div class="kpi"><div>회송 카톤<b class="num">${rs.reduce((a,r)=>a+(r.cartons||0),0)}</b></div><div>놓친 매출 (부가세 포함)<b class="num">${won(l)}원</b></div></div>
  </div>
  ${Object.keys(byR).length?`<div class="card"><h3>사유별</h3>${Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:6px 0"><span class="sp">${esc(k)}</span><b class="num">${v}건</b></div>`).join('')}</div>`:''}
  <div class="card">${rs.map(r=>`<div class="br">
    <div class="top"><b style="font-size:14.5px">${esc(r.name)}</b></div>
    <div class="sm"><span>${+r.date.slice(5,7)}/${+r.date.slice(8)} (${WD[pd(r.date).getDay()]}) 입고</span><span>${esc(r.center)}</span><span>${esc(r.brand)}</span></div>
    <div class="mini" style="margin-top:8px"><div>납품 시도<b class="num">${r.tried.toLocaleString('ko-KR')}</b></div><div>납품됨<b class="num">${r.delivered.toLocaleString('ko-KR')}</b></div><div>회송<b class="num neg">${r.returned.toLocaleString('ko-KR')}개 · ${r.cartons??'-'}카톤</b></div></div>
    <div class="iss" style="margin-top:8px;background:var(--stampbg);color:var(--stamp);border-radius:10px;padding:8px 10px;font-size:13.5px"><b>사유</b> · ${esc(r.reason)}${r.memo?`<div style="color:var(--sub);font-size:12.5px;margin-top:2px">${esc(r.memo)}</div>`:''}</div>
    <div class="muted" style="font-size:11.5px;margin-top:4px">놓친 매출 ${r.lost?won(r.lost)+'원':'단가 확인 전'} · 근거: ${esc(r.source||'올리브원 납품확인서')}</div></div>`).join('')||'<div class="empty">이 달 회송이 없어요</div>'}</div>
  <div class="note">회송 수량은 올리브원 <b>납품예정수량 − 검수 확정 납품수량</b>이에요. 사유는 CJ 납품완료보고서에 검수자가 손으로 적은 내용을 옮긴 거라, "판독 어려움"이나 "추정"으로 표시된 건은 확인해 주세요.</div>`;
}

/* ---------- 시트 ---------- */
function sheet(h){$('#sheetBody').innerHTML=h;$('#sheet').scrollTop=0;$('#sheet').classList.add('on');$('#dim').classList.add('on');}
function closeAll(){$('#sheet').classList.remove('on');$('#dim').classList.remove('on');}
$('#dim').onclick=closeAll;
setInterval(async()=>{if(!PW)return;try{const m=await (await fetch('meta.json',{cache:'no-store'})).json();if(m.built!==META.built){await load(PW);render();toast('새 손익 자료로 업데이트했어요');}}catch(e){}},300000);
</script>
</body>
</html>
